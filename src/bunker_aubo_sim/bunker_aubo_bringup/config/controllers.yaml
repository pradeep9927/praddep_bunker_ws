controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

diff_drive_controller:
  ros__parameters:
    left_wheel_names:  [left_wheel_1_joint, left_wheel_2_joint, left_wheel_3_joint, left_wheel_4_joint]
    right_wheel_names: [right_wheel_1_joint, right_wheel_2_joint, right_wheel_3_joint, right_wheel_4_joint]

    wheel_separation: 0.63
    wheel_radius: 0.075
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: false
    tf_frame_prefix_enable: false
    publish_rate: 50.0
    open_loop: false
    position_feedback: true
    cmd_vel_timeout: 0.5

    pose_covariance_diagonal:  [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal: [0.002, 0.002, 1000000.0, 1000000.0, 1000000.0, 0.05]

    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 1.0
    linear.x.max_deceleration: -1.5     # must be <= 0
    angular.z.max_velocity: 1.2
    angular.z.min_velocity: -1.2
    angular.z.max_acceleration: 2.0
    angular.z.max_deceleration: -2.0

arm_controller:
  ros__parameters:
    joints:
      - shoulder_joint
      - upperArm_joint
      - foreArm_joint
      - wrist1_joint
      - wrist2_joint
      - wrist3_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true      # GUI can move a single joint
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
      shoulder_joint: {trajectory: 0.3, goal: 0.05}
      upperArm_joint: {trajectory: 0.3, goal: 0.05}
      foreArm_joint:  {trajectory: 0.3, goal: 0.05}
      wrist1_joint:   {trajectory: 0.3, goal: 0.05}
      wrist2_joint:   {trajectory: 0.3, goal: 0.05}
      wrist3_joint:   {trajectory: 0.3, goal: 0.05}

gripper_controller:
  ros__parameters:
    joints:
      - gripper_left_finger_joint
      - gripper_right_finger_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 1.0
      # Loose on purpose: when the fingers close on an object they stop short of the target. A
      # tight goal tolerance would make the controller abort and stop squeezing. Whether the
      # gap was reached is decided by gripper_action_server from /joint_states instead.
      gripper_left_finger_joint:  {trajectory: 0.0, goal: 0.045}
      gripper_right_finger_joint: {trajectory: 0.0, goal: 0.045}
